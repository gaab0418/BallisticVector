name: Promotion Gate

# Rulesets nao conseguem restringir a branch de ORIGEM de um PR. Este check
# (marcado como obrigatorio nas rulesets) fecha essa lacuna:
#   feature/*, fix/*, ...  -> development
#   development            -> staging
#   staging                -> main
#
# Em PRs para main, tambem confirma que a tag v<VERSION> ainda nao existe, para
# o esquecimento do bump aparecer no PR e nao so no deploy, depois do merge.
on:
  pull_request:
    branches:
      - development
      - staging
      - main

permissions:
  contents: read

jobs:
  gate:
    name: Gate de promocao
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: github.base_ref == 'main'
        uses: actions/checkout@v7

      - name: Validar origem do PR
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "${BASE}" in
            main)    permitido='staging' ;;
            staging) permitido='development' ;;
            *)       permitido='' ;;
          esac

          if [ -n "${permitido}" ] && [ "${HEAD}" != "${permitido}" ]; then
            echo "::error::PRs para '${BASE}' so podem vir de '${permitido}' (origem: '${HEAD}')."
            exit 1
          fi

          # development recebe qualquer branch, menos as de promocao.
          if [ "${BASE}" = 'development' ] && { [ "${HEAD}" = 'staging' ] || [ "${HEAD}" = 'main' ]; }; then
            echo "::error::Nao se faz PR de '${HEAD}' para 'development'. Traga mudancas por merge local."
            exit 1
          fi

          echo "Origem '${HEAD}' -> '${BASE}' permitida."

      # Le o VERSION do resultado do merge, que e o que a main vai ter.
      - name: Validar versao nova
        if: github.base_ref == 'main'
        run: |
          set -euo pipefail
          versao="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "${versao}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION deve ser X.Y.Z (encontrado: '${versao}')."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${versao}" >/dev/null; then
            echo "::error::A tag v${versao} ja existe. Incremente o arquivo VERSION antes de promover para main."
            exit 1
          fi
          echo "v${versao} esta livre."
