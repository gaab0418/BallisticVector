name: Release

# Dois canais de entrega:
#   push na main  -> pre-release rolante de tag `staging`, sobrescrita a cada
#                    push, para sempre existir um link com o ultimo build.
#   tag v*        -> release com notas geradas dos commits. Uma tag com
#                   sufixo (v1.1.0-beta, v2.0.0-rc1) vira pre-release.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Permite disparar o build sob demanda em qualquer branch. Como o job
  # `publish` exige main ou tag v*, um disparo manual valida a exportacao
  # sem publicar nada.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Repete a validacao do CI de proposito: garante que nem um push direto na
  # main publique um build quebrado.
  validate:
    name: Validar
    uses: ./.github/workflows/ci.yml

  build:
    name: Exportar Windows e Linux
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Godot
        uses: ./.github/actions/setup-godot

      - name: Importar recursos
        run: godot --headless --import

      # Os dois presets sao exportados no mesmo job de proposito: uma matrix
      # repetiria o download do Godot e o import a toa, e o mesmo .tpz ja
      # contem os templates das duas plataformas.
      #
      # O caminho passado na linha de comando tem precedencia sobre o
      # `export_path` do preset (que aponta para ../Entregavel/, fora do
      # repositorio), deixando o fluxo local de exportacao intacto.
      - name: Exportar builds
        run: |
          set -euo pipefail
          mkdir -p build

          exportar() {
            preset="$1"
            saida="$2"
            echo "::group::${preset} -> ${saida}"
            godot --headless --export-release "${preset}" "${PWD}/build/${saida}"

            # O Godot pode encerrar com codigo 0 mesmo sem gerar o binario.
            if [ ! -f "build/${saida}" ]; then
              echo "::error::O export do preset '${preset}' nao produziu build/${saida}."
              exit 1
            fi
            echo "gerado: $(du -h "build/${saida}" | cut -f1)"
            echo "::endgroup::"
          }

          exportar "PAC_BallisticVector"       "PAC_BallisticVector.exe"
          exportar "PAC_BallisticVector_Linux" "PAC_BallisticVector.x86_64"

          chmod +x build/PAC_BallisticVector.x86_64
          ls -lh build/

      - name: Publicar artefatos
        uses: actions/upload-artifact@v7
        with:
          name: builds
          path: |
            build/PAC_BallisticVector.exe
            build/PAC_BallisticVector.x86_64
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publicar
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v8
        with:
          name: builds
          path: build

      - name: Publicar staging (pre-release rolante)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: staging
          target_commitish: ${{ github.sha }}
          name: Staging - ultimo build da main
          prerelease: true
          make_latest: false
          files: |
            build/PAC_BallisticVector.exe
            build/PAC_BallisticVector.x86_64
          body: |
            Build automatico da branch `main`. Sobrescrito a cada push.

            - Commit: ${{ github.sha }}
            - Gerado em: ${{ github.event.head_commit.timestamp }}

            **Windows:** baixe `PAC_BallisticVector.exe` e execute.

            **Linux:** baixe `PAC_BallisticVector.x86_64`. O bit de execucao
            nao sobrevive ao download, entao libere antes de rodar:

            ```
            chmod +x PAC_BallisticVector.x86_64
            ./PAC_BallisticVector.x86_64
            ```

            Para uma versao estavel, use a release mais recente com tag `v*`.

      # Pelo versionamento semantico, tudo apos um hifen e identificador de
      # pre-lancamento: v1.1.0-beta e v2.0.0-rc1 sao pre-releases, v1.1.0 nao.
      # Sem esta distincao, uma beta apareceria como "Latest" no repositorio.
      - name: Publicar release por tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            build/PAC_BallisticVector.exe
            build/PAC_BallisticVector.x86_64
