name: Deploy

# Promocao por branch, cada uma com o seu GitHub Environment:
#   push em staging -> tag `v<VERSION>-rc.<run>`  -> pre-release  (environment: staging)
#   push em main    -> tag `v<VERSION>`           -> release      (environment: production)
#
# <VERSION> vem do arquivo VERSION na raiz. Quem promove staging -> main
# precisa te-lo incrementado, porque a tag de producao e imutavel: se ela ja
# existir, o deploy falha em vez de sobrescrever uma release.
on:
  push:
    branches:
      - staging
      - main
  # Valida e exporta em qualquer branch, mas o job `publish` so roda em
  # staging e main, entao um disparo manual noutra branch nao publica nada.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Repete a validacao do CI de proposito: garante que nem um push direto na
  # main publique um build quebrado.
  validate:
    name: Validar
    uses: ./.github/workflows/ci.yml

  # Falha cedo (antes do build) se a tag de producao ja existe.
  version:
    name: Resolver versao
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Calcular tag
        id: v
        run: |
          set -euo pipefail
          versao="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "${versao}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION deve ser X.Y.Z (encontrado: '${versao}')."
            exit 1
          fi

          if [ "${GITHUB_REF_NAME}" = 'main' ]; then
            tag="v${versao}"
            prerelease=false
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "::error::A tag ${tag} ja existe. Incremente o arquivo VERSION antes de promover para main."
              exit 1
            fi
          else
            tag="v${versao}-rc.${GITHUB_RUN_NUMBER}"
            prerelease=true
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Tag desta execucao: ${tag}"

  build:
    name: Exportar Windows e Linux
    needs: [validate, version]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar Godot
        uses: ./.github/actions/setup-godot

      - name: Importar recursos
        run: godot --headless --import

      # Os dois presets sao exportados no mesmo job de proposito: uma matrix
      # repetiria o download do Godot e o import a toa, e o mesmo .tpz ja
      # contem os templates das duas plataformas.
      #
      # O caminho passado na linha de comando tem precedencia sobre o
      # `export_path` do preset (que aponta para ../Entregavel/, fora do
      # repositorio), deixando o fluxo local de exportacao intacto.
      - name: Exportar builds
        run: |
          set -euo pipefail
          mkdir -p build

          exportar() {
            preset="$1"
            saida="$2"
            echo "::group::${preset} -> ${saida}"
            godot --headless --export-release "${preset}" "${PWD}/build/${saida}"

            # O Godot pode encerrar com codigo 0 mesmo sem gerar o binario.
            if [ ! -f "build/${saida}" ]; then
              echo "::error::O export do preset '${preset}' nao produziu build/${saida}."
              exit 1
            fi
            echo "gerado: $(du -h "build/${saida}" | cut -f1)"
            echo "::endgroup::"
          }

          exportar "PAC_BallisticVector"       "PAC_BallisticVector.exe"
          exportar "PAC_BallisticVector_Linux" "PAC_BallisticVector.x86_64"

          chmod +x build/PAC_BallisticVector.x86_64
          ls -lh build/

      - name: Publicar artefatos
        uses: actions/upload-artifact@v7
        with:
          name: builds
          path: |
            build/PAC_BallisticVector.exe
            build/PAC_BallisticVector.x86_64
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publicar
    needs: [build, version]
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Segredos, variaveis e regras de aprovacao vem do Environment da branch.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      contents: write

    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v8
        with:
          name: builds
          path: build

      # O action cria a tag em `target_commitish` se ela ainda nao existir.
      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.version.outputs.prerelease != 'true' }}
          files: |
            build/PAC_BallisticVector.exe
            build/PAC_BallisticVector.x86_64
          body: |
            Ambiente: `${{ github.ref_name == 'main' && 'production' || 'staging' }}` - commit ${{ github.sha }}

            **Windows:** baixe `PAC_BallisticVector.exe` e execute.

            **Linux:** baixe `PAC_BallisticVector.x86_64`. O bit de execucao
            nao sobrevive ao download, entao libere antes de rodar:

            ```
            chmod +x PAC_BallisticVector.x86_64
            ./PAC_BallisticVector.x86_64
            ```
